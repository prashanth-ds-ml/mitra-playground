name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  levels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools and level requirements
        run: |
          python -m pip install pytest
          for f in levels/*/requirements.txt; do
            if [ -f "$f" ]; then python -m pip install -r "$f"; fi
          done
      - name: Self-tests
        run: python -m pytest -q tests
      - name: Check every level (start fails, reference passes)
        run: python scripts/check_level.py --all
